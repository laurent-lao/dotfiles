[bar.default]
background_opacity = 0.0
capsule = true
capsule_opacity = 0.74999998323619366
concave_edge_corners = false
margin_ends = 0
shadow = false

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 0.33999999240040779
concave_edge_corners = false
enabled = true
icon_size = 28
pinned = [ "org.kde.dolphin", "Alacritty", "firefox", "obsidian" ]
reserve_space = false
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

